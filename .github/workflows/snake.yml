name: Gerador de Cobrinha de Contribuições (Snake)

on:
  schedule:
    # Executa todos os dias às 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'

concurrency:
  group: snake-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    name: Gerar Animação da Cobrinha
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        # Fixado em v4.2.2 para reprodutibilidade de CI
        uses: actions/checkout@v4.2.2

      - name: Gerar Gráfico Snake (Ciano Cyberpunk)
        # Platane/snk fixado em v3.2.0 (versão semântica major/minor estável)
        uses: Platane/snk@v3.2.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#007799&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00e5ff&color_dots=#161b22,#003b46,#007799,#00b4d8,#00e5ff
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publicar Arquivos na Branch Output
        # crazy-max/ghaction-github-pages fixado em v4.1.0 (deploy seguro para branch isolada)
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

