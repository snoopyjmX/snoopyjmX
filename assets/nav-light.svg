<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 44" width="900" height="44" role="img" aria-label="Barra de Navegação do Perfil">
  <title>Navegação: Sobre, Projetos, Stack, Atividade, Contato</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-subtle: #eaeef2;
      --border: #d0d7de;
      --border-subtle: #e1e4e8;
      --text: #1f2328;
      --text-sec: #57606a;
      --text-ter: #6e7781;
      --accent: #007799;
      --accent-subtle: rgba(0, 119, 153, 0.10);
      --accent-glow: rgba(0, 119, 153, 0.20);
      --accent-sec: #6544d6;
      --accent-sec-subtle: rgba(101, 68, 214, 0.10);
      --success: #1a7f37;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    text {
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Pulse animation for status dots */
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    .pulse {
      transform-origin: center;
      animation: pulse-glow 3.5s ease-in-out infinite;
    }

    /* Staggered entrance reveal (opacity only to preserve SVG translate transforms) */
    @keyframes fade-in-up {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .fade-in {
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Stroke draw effect */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Very subtle rare glitch (1x every 8s, 0.3s duration) */
    @keyframes subtle-glitch {
      0%, 96%, 100% {
        opacity: 1;
      }
      97% {
        opacity: 0.75;
      }
      98% {
        opacity: 0.9;
      }
      99% {
        opacity: 1;
      }
    }

    .glitch-text {
      animation: subtle-glitch 8s infinite ease-in-out;
    }

    /* Scanline traversing effect */
    @keyframes scanline-sweep {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(300px);
        opacity: 0;
      }
    }

    .scanline {
      animation: scanline-sweep 7s linear infinite;
    }

    /* Traveling light dot */
    @keyframes travel-dot {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateX(1100px);
        opacity: 0;
      }
    }

    /* Cursor blink */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: blink 1.1s infinite steps(1);
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, .pulse, .fade-in, .glitch-text, .scanline, .cursor, .animated-stroke {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
      }
    }
  </style>
  
    <defs>
      <!-- Cyberpunk Radial Ambient Glow -->
      <radialGradient id="ambientGlow" cx="80%" cy="20%" r="70%">
        <stop offset="0%" stop-color="#6544d6" stop-opacity="0.07" />
        <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0" />
      </radialGradient>

      <!-- Linear Accent Accent Line Gradient -->
      <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#007799" stop-opacity="0" />
        <stop offset="30%" stop-color="#007799" stop-opacity="0.9" />
        <stop offset="70%" stop-color="#6544d6" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#6544d6" stop-opacity="0" />
      </linearGradient>

      <!-- Subtle Card Header Gradient -->
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#eaeef2" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
      </linearGradient>

      <!-- Scanline Pattern -->
      <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(87, 96, 106, 0.06)" stroke-width="1" />
      </pattern>

      <!-- Subtle Dot Matrix Grid -->
      <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(87, 96, 106, 0.06)" stroke-width="0.75" />
      </pattern>
    </defs>
  

  <rect width="900" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
  
    <g class="corner-brackets" stroke="#007799" stroke-width="1.5" fill="none">
      <!-- Top Left -->
      <path d="M 4 10 L 4 4 L 10 4" />
      <!-- Top Right -->
      <path d="M 890 4 L 896 4 L 896 10" />
      <!-- Bottom Left -->
      <path d="M 4 34 L 4 40 L 10 40" />
      <!-- Bottom Right -->
      <path d="M 890 40 L 896 40 L 896 34" />
    </g>
  

  
    <g transform="translate(25, 12)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="#eaeef2" stroke="#e1e4e8" stroke-width="1" />
      <text x="14" y="15" fill="#007799" font-size="10" font-weight="700">01.</text>
      <text x="36" y="15" fill="#1f2328" font-size="11" font-weight="600" letter-spacing="0.5">SOBRE</text>
    </g>
  

    <g transform="translate(195, 12)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="#eaeef2" stroke="#e1e4e8" stroke-width="1" />
      <text x="14" y="15" fill="#007799" font-size="10" font-weight="700">02.</text>
      <text x="36" y="15" fill="#1f2328" font-size="11" font-weight="600" letter-spacing="0.5">PROJETOS</text>
    </g>
  

    <g transform="translate(385, 12)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="#eaeef2" stroke="#e1e4e8" stroke-width="1" />
      <text x="14" y="15" fill="#007799" font-size="10" font-weight="700">03.</text>
      <text x="36" y="15" fill="#1f2328" font-size="11" font-weight="600" letter-spacing="0.5">STACK</text>
    </g>
  

    <g transform="translate(555, 12)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="#eaeef2" stroke="#e1e4e8" stroke-width="1" />
      <text x="14" y="15" fill="#007799" font-size="10" font-weight="700">04.</text>
      <text x="36" y="15" fill="#1f2328" font-size="11" font-weight="600" letter-spacing="0.5">ATIVIDADE</text>
    </g>
  

    <g transform="translate(745, 12)">
      <rect x="0" y="0" width="135" height="22" rx="4" fill="#eaeef2" stroke="#e1e4e8" stroke-width="1" />
      <text x="14" y="15" fill="#007799" font-size="10" font-weight="700">05.</text>
      <text x="36" y="15" fill="#1f2328" font-size="11" font-weight="600" letter-spacing="0.5">CONTATO</text>
    </g>
  
</svg>