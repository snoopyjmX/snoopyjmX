<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Header Banner - João Marcelo Garcês">
  <title>João Marcelo Garcês // Full-Stack Developer &amp; DevOps</title>
  <style>
    
    :root {
      --bg: #0a0e14;
      --surface: #0d1117;
      --surface-subtle: #161b22;
      --border: #30363d;
      --border-subtle: #21262d;
      --text: #e6edf3;
      --text-sec: #8b949e;
      --text-ter: #6e7681;
      --accent: #00e5ff;
      --accent-subtle: rgba(0, 229, 255, 0.12);
      --accent-glow: rgba(0, 229, 255, 0.25);
      --accent-sec: #7c5cff;
      --accent-sec-subtle: rgba(124, 92, 255, 0.12);
      --success: #3fb950;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    text {
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Pulse animation for status dots */
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    .pulse {
      transform-origin: center;
      animation: pulse-glow 3.5s ease-in-out infinite;
    }

    /* Staggered entrance reveal */
    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Stroke draw effect */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Very subtle rare glitch (1x every 8s, 0.3s duration) */
    @keyframes subtle-glitch {
      0%, 96%, 100% {
        transform: translate(0, 0);
        opacity: 1;
        text-shadow: none;
      }
      97% {
        transform: translate(-1.5px, 0.5px);
        text-shadow: 1px 0 var(--accent), -1px 0 var(--accent-sec);
      }
      98% {
        transform: translate(1.5px, -0.5px);
        text-shadow: -1px 0 var(--accent), 1px 0 var(--accent-sec);
      }
      99% {
        transform: translate(0, 0);
        text-shadow: none;
      }
    }

    .glitch-text {
      display: inline-block;
      animation: subtle-glitch 8s infinite ease-in-out;
    }

    /* Scanline traversing effect */
    @keyframes scanline-sweep {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(300px);
        opacity: 0;
      }
    }

    .scanline {
      animation: scanline-sweep 7s linear infinite;
    }

    /* Traveling light dot */
    @keyframes travel-dot {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateX(1100px);
        opacity: 0;
      }
    }

    /* Cursor blink */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: blink 1.1s infinite steps(1);
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, .pulse, .fade-in, .glitch-text, .scanline, .cursor, .animated-stroke {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
      }
    }
  
    .hud-box {
      fill: #161b22;
      stroke: #21262d;
      stroke-width: 1;
    }
    .draw-path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: draw-line 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
  
    <defs>
      <!-- Cyberpunk Radial Ambient Glow -->
      <radialGradient id="ambientGlow" cx="80%" cy="20%" r="70%">
        <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#0a0e14" stop-opacity="0" />
      </radialGradient>

      <!-- Linear Accent Accent Line Gradient -->
      <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
        <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.9" />
        <stop offset="70%" stop-color="#7c5cff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#7c5cff" stop-opacity="0" />
      </linearGradient>

      <!-- Subtle Card Header Gradient -->
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#161b22" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95" />
      </linearGradient>

      <!-- Scanline Pattern -->
      <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(110, 118, 129, 0.06)" stroke-width="1" />
      </pattern>

      <!-- Subtle Dot Matrix Grid -->
      <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(110, 118, 129, 0.06)" stroke-width="0.75" />
      </pattern>
    </defs>
  

  <!-- Background Base -->
  <rect width="1200" height="280" rx="14" fill="#0a0e14" stroke="#30363d" stroke-width="1.2" />
  <rect width="1200" height="280" rx="14" fill="url(#ambientGlow)" />
  <rect width="1200" height="280" rx="14" fill="url(#cyberGrid)" />

  <!-- Corner Brackets -->
  
    <g class="corner-brackets" stroke="#00e5ff" stroke-width="1.5" fill="none">
      <!-- Top Left -->
      <path d="M 12 24 L 12 12 L 24 12" />
      <!-- Top Right -->
      <path d="M 1176 12 L 1188 12 L 1188 24" />
      <!-- Bottom Left -->
      <path d="M 12 256 L 12 268 L 24 268" />
      <!-- Bottom Right -->
      <path d="M 1176 268 L 1188 268 L 1188 256" />
    </g>
  

  <!-- Scanline Sweep Effect -->
  <g opacity="0.12" class="scanline">
    <line x1="16" y1="0" x2="1184" y2="0" stroke="#00e5ff" stroke-width="2" />
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(48, 44)" class="fade-in">
    <rect x="0" y="0" width="220" height="24" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#3fb950" class="pulse" />
    <circle cx="14" cy="12" r="6" fill="#3fb950" opacity="0.3" class="pulse" />
    <text x="26" y="16" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1">SYSTEM ONLINE · GOIÂNIA/BR</text>
  </g>

  <!-- Decorative Orbit / Radar Indicator (Right Background) -->
  <g transform="translate(1080, 140)" opacity="0.25">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#7c5cff" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00e5ff" stroke-width="1" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#30363d" stroke-width="1" />
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#30363d" stroke-width="0.75" />
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#30363d" stroke-width="0.75" />
    <circle cx="34" cy="-34" r="3" fill="#00e5ff" />
  </g>

  <!-- Big Name with Rare Subtle Glitch -->
  <g transform="translate(48, 116)" class="fade-in">
    <text x="0" y="0" fill="#e6edf3" font-size="34" font-weight="800" letter-spacing="2" class="glitch-text">JOÃO MARCELO GARCÊS</text>
  </g>

  <!-- Accent Line (Draws on entrance) -->
  <g transform="translate(48, 134)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="url(#cyanLineGrad)" stroke-width="2" class="draw-path" />
  </g>

  <!-- Subtitle with perfectly aligned trailing cursor inside tspan (no overlap) -->
  <g transform="translate(48, 168)" class="fade-in">
    <text x="0" y="0" fill="#8b949e" font-size="15" font-weight="500" letter-spacing="0.5">Full-Stack Developer (React &amp; Node.js) // DevOps leve<tspan fill="#00e5ff" font-weight="700" class="cursor"> ▌</tspan></text>
  </g>

  <!-- Secondary Philosophy Tagline -->
  <g transform="translate(48, 202)" class="fade-in">
    <text x="0" y="0" fill="#6e7681" font-size="12" font-weight="400" letter-spacing="0.5">Estudante de Engenharia de Software (UniGOiás) · Goiânia, Brasil</text>
  </g>

  <!-- Terminal Status Panel (Right side) -->
  <g transform="translate(720, 48)" class="fade-in">
    <rect x="0" y="0" width="410" height="184" rx="8" class="hud-box" />
    
    <g class="corner-brackets" stroke="#7c5cff" stroke-width="1.5" fill="none">
      <!-- Top Left -->
      <path d="M 0 8 L 0 0 L 8 0" />
      <!-- Top Right -->
      <path d="M 402 0 L 410 0 L 410 8" />
      <!-- Bottom Left -->
      <path d="M 0 176 L 0 184 L 8 184" />
      <!-- Bottom Right -->
      <path d="M 402 184 L 410 184 L 410 176" />
    </g>
  

    <!-- HUD Header -->
    <rect x="0" y="0" width="410" height="28" rx="8" fill="#0d1117" />
    <line x1="0" y1="28" x2="410" y2="28" stroke="#21262d" stroke-width="1" />
    <circle cx="16" cy="14" r="3.5" fill="#00e5ff" />
    <circle cx="28" cy="14" r="3.5" fill="#7c5cff" />
    <circle cx="40" cy="14" r="3.5" fill="#3fb950" />
    <text x="56" y="18" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1">STATUS_PANEL // SYS_DIAGNOSTIC</text>

    <!-- HUD Items -->
    <g transform="translate(20, 58)">
      <text x="0" y="0" fill="#6e7681" font-size="11" font-weight="600">ROLE:</text>
      <text x="90" y="0" fill="#e6edf3" font-size="11" font-weight="600">FULL-STACK DEVELOPER</text>

      <text x="0" y="28" fill="#6e7681" font-size="11" font-weight="600">TRILHA:</text>
      <text x="90" y="28" fill="#00e5ff" font-size="11" font-weight="600">50% FRONT · 30% BACK · 20% OPS</text>

      <text x="0" y="56" fill="#6e7681" font-size="11" font-weight="600">PREFERÊNCIA:</text>
      <text x="90" y="56" fill="#e6edf3" font-size="11" font-weight="500">Front-end · Aprendizado Prático</text>

      <text x="0" y="84" fill="#6e7681" font-size="11" font-weight="600">IDIOMAS:</text>
      <text x="90" y="84" fill="#8b949e" font-size="11" font-weight="500">PT (nativo) · EN/ES (intermediário)</text>

      <text x="0" y="108" fill="#6e7681" font-size="10" font-weight="500">DEPLOY_STATE:</text>
      <text x="90" y="108" fill="#3fb950" font-size="10" font-weight="600">CLEAN // PRODUCTION-READY</text>
    </g>
  </g>
</svg>