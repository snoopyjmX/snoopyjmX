<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 52" width="850" height="52" role="img" aria-label="Cyberpunk Terminal Typing Animation">
  <title>Desenvolvendo aplicações web e mobile com React, TypeScript e Node.js.</title>
  <style>
    
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-subtle: #eaeef2;
      --border: #d0d7de;
      --border-subtle: #e1e4e8;
      --text: #1f2328;
      --text-sec: #57606a;
      --text-ter: #6e7781;
      --accent: #007799;
      --accent-subtle: rgba(0, 119, 153, 0.10);
      --accent-glow: rgba(0, 119, 153, 0.20);
      --accent-sec: #6544d6;
      --accent-sec-subtle: rgba(101, 68, 214, 0.10);
      --success: #1a7f37;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    text {
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Pulse animation for status dots */
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    .pulse {
      transform-origin: center;
      animation: pulse-glow 3.5s ease-in-out infinite;
    }

    /* Staggered entrance reveal (opacity only to preserve SVG translate transforms) */
    @keyframes fade-in-up {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .fade-in {
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Stroke draw effect */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Very subtle rare glitch (1x every 8s, 0.3s duration) */
    @keyframes subtle-glitch {
      0%, 96%, 100% {
        opacity: 1;
      }
      97% {
        opacity: 0.75;
      }
      98% {
        opacity: 0.9;
      }
      99% {
        opacity: 1;
      }
    }

    .glitch-text {
      animation: subtle-glitch 8s infinite ease-in-out;
    }

    /* Scanline traversing effect */
    @keyframes scanline-sweep {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(300px);
        opacity: 0;
      }
    }

    .scanline {
      animation: scanline-sweep 7s linear infinite;
    }

    /* Traveling light dot */
    @keyframes travel-dot {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateX(1100px);
        opacity: 0;
      }
    }

    /* Cursor blink */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: blink 1.1s infinite steps(1);
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, .pulse, .fade-in, .glitch-text, .scanline, .cursor, .animated-stroke {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
      }
    }
  
    .typing-container {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 500;
      fill: var(--text);
    }
    .phrase {
      opacity: 0;
      position: relative;
    }
    /* Total cycle: 16s (4 phrases x 4s each) */
    @keyframes cycle-phrase-1 {
      0%, 2% { opacity: 0; clip-path: inset(0 100% 0 0); }
      4%, 22% { opacity: 1; clip-path: inset(0 0% 0 0); }
      24%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
    }
    @keyframes cycle-phrase-2 {
      0%, 24% { opacity: 0; clip-path: inset(0 100% 0 0); }
      26%, 47% { opacity: 1; clip-path: inset(0 0% 0 0); }
      49%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
    }
    @keyframes cycle-phrase-3 {
      0%, 49% { opacity: 0; clip-path: inset(0 100% 0 0); }
      51%, 72% { opacity: 1; clip-path: inset(0 0% 0 0); }
      74%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
    }
    @keyframes cycle-phrase-4 {
      0%, 74% { opacity: 0; clip-path: inset(0 100% 0 0); }
      76%, 97% { opacity: 1; clip-path: inset(0 0% 0 0); }
      99%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
    }

    .p1 { animation: cycle-phrase-1 16s steps(42, end) infinite; }
    .p2 { animation: cycle-phrase-2 16s steps(42, end) infinite; }
    .p3 { animation: cycle-phrase-3 16s steps(42, end) infinite; }
    .p4 { animation: cycle-phrase-4 16s steps(42, end) infinite; }

    @media (prefers-reduced-motion: reduce) {
      .p1 { opacity: 1 !important; clip-path: none !important; animation: none !important; }
      .p2, .p3, .p4 { display: none !important; }
    }
  </style>

  <rect width="850" height="52" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
  
    <g class="corner-brackets" stroke="#007799" stroke-width="1.5" fill="none">
      <!-- Top Left -->
      <path d="M 4 10 L 4 4 L 10 4" />
      <!-- Top Right -->
      <path d="M 840 4 L 846 4 L 846 10" />
      <!-- Bottom Left -->
      <path d="M 4 42 L 4 48 L 10 48" />
      <!-- Bottom Right -->
      <path d="M 840 48 L 846 48 L 846 42" />
    </g>
  

  <!-- Terminal prompt icon -->
  <g transform="translate(24, 31)">
    <text x="0" y="0" fill="#007799" font-size="15" font-weight="700">&gt;</text>
  </g>

  <!-- Animated Phrases -->
  <g transform="translate(48, 31)" class="typing-container">
    <text class="phrase p1" x="0" y="0">Desenvolvendo aplicações web e mobile com React, TypeScript e Node.js.<tspan fill="#007799" class="cursor"> ▌</tspan></text>
    <text class="phrase p2" x="0" y="0">Foco em código limpo, arquitetura sólida e testes automatizados.<tspan fill="#007799" class="cursor"> ▌</tspan></text>
    <text class="phrase p3" x="0" y="0">Explorando CI/CD, Docker e boas práticas de entrega contínua.<tspan fill="#007799" class="cursor"> ▌</tspan></text>
    <text class="phrase p4" x="0" y="0">Sempre aprendendo na prática, construindo projetos reais.<tspan fill="#007799" class="cursor"> ▌</tspan></text>
  </g>
</svg>