<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 86" width="1200" height="86" role="img" aria-label="Rodapé do Perfil">
  <title>Terminal Rodapé: $ git commit -m "sempre aprendendo"</title>
  <style>
    :root {
      --bg: #0a0e14;
      --surface: #0d1117;
      --surface-subtle: #161b22;
      --border: #30363d;
      --border-subtle: #21262d;
      --text: #e6edf3;
      --text-sec: #8b949e;
      --text-ter: #6e7681;
      --accent: #00e5ff;
      --accent-subtle: rgba(0, 229, 255, 0.12);
      --accent-glow: rgba(0, 229, 255, 0.25);
      --accent-sec: #7c5cff;
      --accent-sec-subtle: rgba(124, 92, 255, 0.12);
      --success: #3fb950;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    text {
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Pulse animation for status dots */
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    .pulse {
      transform-origin: center;
      animation: pulse-glow 3.5s ease-in-out infinite;
    }

    /* Staggered entrance reveal (opacity only to preserve SVG translate transforms) */
    @keyframes fade-in-up {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .fade-in {
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Stroke draw effect */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Very subtle rare glitch (1x every 8s, 0.3s duration) */
    @keyframes subtle-glitch {
      0%, 96%, 100% {
        opacity: 1;
      }
      97% {
        opacity: 0.75;
      }
      98% {
        opacity: 0.9;
      }
      99% {
        opacity: 1;
      }
    }

    .glitch-text {
      animation: subtle-glitch 8s infinite ease-in-out;
    }

    /* Scanline traversing effect */
    @keyframes scanline-sweep {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(300px);
        opacity: 0;
      }
    }

    .scanline {
      animation: scanline-sweep 7s linear infinite;
    }

    /* Traveling light dot */
    @keyframes travel-dot {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateX(1100px);
        opacity: 0;
      }
    }

    /* Cursor blink */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: blink 1.1s infinite steps(1);
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, .pulse, .fade-in, .glitch-text, .scanline, .cursor, .animated-stroke {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
      }
    }
  </style>
  
    <defs>
      <!-- Cyberpunk Radial Ambient Glow -->
      <radialGradient id="ambientGlow" cx="80%" cy="20%" r="70%">
        <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#0a0e14" stop-opacity="0" />
      </radialGradient>

      <!-- Linear Accent Accent Line Gradient -->
      <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
        <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.9" />
        <stop offset="70%" stop-color="#7c5cff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#7c5cff" stop-opacity="0" />
      </linearGradient>

      <!-- Subtle Card Header Gradient -->
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#161b22" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95" />
      </linearGradient>

      <!-- Scanline Pattern -->
      <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(110, 118, 129, 0.06)" stroke-width="1" />
      </pattern>

      <!-- Subtle Dot Matrix Grid -->
      <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(110, 118, 129, 0.06)" stroke-width="0.75" />
      </pattern>
    </defs>
  

  <rect width="1200" height="86" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <rect width="1200" height="86" rx="10" fill="url(#ambientGlow)" />
  
    <g class="corner-brackets" stroke="#00e5ff" stroke-width="1.5" fill="none">
      <!-- Top Left -->
      <path d="M 6 14 L 6 6 L 14 6" />
      <!-- Top Right -->
      <path d="M 1186 6 L 1194 6 L 1194 14" />
      <!-- Bottom Left -->
      <path d="M 6 72 L 6 80 L 14 80" />
      <!-- Bottom Right -->
      <path d="M 1186 80 L 1194 80 L 1194 72" />
    </g>
  

  <!-- Git Commit Command line -->
  <g transform="translate(32, 38)">
    <text x="0" y="0" fill="#00e5ff" font-size="13" font-weight="700">&gt;</text>
    <text x="16" y="0" fill="#8b949e" font-size="13" font-weight="600">$ git commit -m &quot;<tspan fill="#e6edf3">sempre aprendendo</tspan>&quot;</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(32, 62)">
    <circle cx="4" cy="-4" r="3" fill="#3fb950" class="pulse" />
    <text x="14" y="0" fill="#6e7681" font-size="11" font-weight="500">SYS_ID: SNOOPYJMX // CORE: OPERACIONAL // GOIÂNIA, BR</text>
  </g>

  <!-- Timestamp updated in America/Sao_Paulo -->
  <g transform="translate(1168, 50)">
    <text x="0" y="0" fill="#6e7681" font-size="11" font-weight="500" text-anchor="end">
      atualizado em: <tspan fill="#00e5ff" font-weight="600">17/10/2026 04:25 BRT</tspan>
    </text>
  </g>
</svg>