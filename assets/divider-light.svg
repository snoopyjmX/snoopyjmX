<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 18" width="1200" height="18" role="img" aria-label="Cyberpunk Section Divider">
  <title>Divider</title>
  <style>
    
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-subtle: #eaeef2;
      --border: #d0d7de;
      --border-subtle: #e1e4e8;
      --text: #1f2328;
      --text-sec: #57606a;
      --text-ter: #6e7781;
      --accent: #007799;
      --accent-subtle: rgba(0, 119, 153, 0.10);
      --accent-glow: rgba(0, 119, 153, 0.20);
      --accent-sec: #6544d6;
      --accent-sec-subtle: rgba(101, 68, 214, 0.10);
      --success: #1a7f37;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    text {
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Pulse animation for status dots */
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    .pulse {
      transform-origin: center;
      animation: pulse-glow 3.5s ease-in-out infinite;
    }

    /* Staggered entrance reveal (opacity only to preserve SVG translate transforms) */
    @keyframes fade-in-up {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .fade-in {
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Stroke draw effect */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Very subtle rare glitch (1x every 8s, 0.3s duration) */
    @keyframes subtle-glitch {
      0%, 96%, 100% {
        opacity: 1;
      }
      97% {
        opacity: 0.75;
      }
      98% {
        opacity: 0.9;
      }
      99% {
        opacity: 1;
      }
    }

    .glitch-text {
      animation: subtle-glitch 8s infinite ease-in-out;
    }

    /* Scanline traversing effect */
    @keyframes scanline-sweep {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(300px);
        opacity: 0;
      }
    }

    .scanline {
      animation: scanline-sweep 7s linear infinite;
    }

    /* Traveling light dot */
    @keyframes travel-dot {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateX(1100px);
        opacity: 0;
      }
    }

    /* Cursor blink */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: blink 1.1s infinite steps(1);
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, .pulse, .fade-in, .glitch-text, .scanline, .cursor, .animated-stroke {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
      }
    }
  
    .light-dot {
      animation: travel-dot 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007799" stop-opacity="0" />
      <stop offset="15%" stop-color="#d0d7de" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#007799" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#6544d6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6544d6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Central Base Line -->
  <line x1="50" y1="9" x2="1150" y2="9" stroke="url(#divGrad)" stroke-width="1.2" />

  <!-- Center Decorative Node -->
  <g transform="translate(600, 9)">
    <circle cx="0" cy="0" r="3" fill="#007799" />
    <circle cx="0" cy="0" r="5" fill="#007799" opacity="0.25" />
    <line x1="-15" y1="0" x2="-6" y2="0" stroke="#007799" stroke-width="1.5" />
    <line x1="6" y1="0" x2="15" y2="0" stroke="#007799" stroke-width="1.5" />
  </g>

  <!-- Traveling Light Dot -->
  <g class="light-dot" transform="translate(50, 9)">
    <circle cx="0" cy="0" r="2.5" fill="#007799" />
    <circle cx="0" cy="0" r="6" fill="#007799" opacity="0.3" />
  </g>
</svg>