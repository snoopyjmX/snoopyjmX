<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" width="440" height="215" role="img" aria-label="Sequência de Commits">
  <title>Sequência de Commits e Consistência</title>
  <style>
    
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-subtle: #eaeef2;
      --border: #d0d7de;
      --border-subtle: #e1e4e8;
      --text: #1f2328;
      --text-sec: #57606a;
      --text-ter: #6e7781;
      --accent: #007799;
      --accent-subtle: rgba(0, 119, 153, 0.10);
      --accent-glow: rgba(0, 119, 153, 0.20);
      --accent-sec: #6544d6;
      --accent-sec-subtle: rgba(101, 68, 214, 0.10);
      --success: #1a7f37;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    text {
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Pulse animation for status dots */
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    .pulse {
      transform-origin: center;
      animation: pulse-glow 3.5s ease-in-out infinite;
    }

    /* Staggered entrance reveal (opacity only to preserve SVG translate transforms) */
    @keyframes fade-in-up {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .fade-in {
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Stroke draw effect */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Very subtle rare glitch (1x every 8s, 0.3s duration) */
    @keyframes subtle-glitch {
      0%, 96%, 100% {
        opacity: 1;
      }
      97% {
        opacity: 0.75;
      }
      98% {
        opacity: 0.9;
      }
      99% {
        opacity: 1;
      }
    }

    .glitch-text {
      animation: subtle-glitch 8s infinite ease-in-out;
    }

    /* Scanline traversing effect */
    @keyframes scanline-sweep {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(300px);
        opacity: 0;
      }
    }

    .scanline {
      animation: scanline-sweep 7s linear infinite;
    }

    /* Traveling light dot */
    @keyframes travel-dot {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateX(1100px);
        opacity: 0;
      }
    }

    /* Cursor blink */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: blink 1.1s infinite steps(1);
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, .pulse, .fade-in, .glitch-text, .scanline, .cursor, .animated-stroke {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
      }
    }
  
    .ring-track {
      fill: none;
      stroke: #eaeef2;
      stroke-width: 8;
    }
    .ring-fill {
      fill: none;
      stroke: #007799;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 238.76;
      stroke-dashoffset: 0;
      transform: rotate(-90deg);
      transform-origin: 75px 125px;
      animation: draw-line 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
  
    <defs>
      <!-- Cyberpunk Radial Ambient Glow -->
      <radialGradient id="ambientGlow" cx="80%" cy="20%" r="70%">
        <stop offset="0%" stop-color="#6544d6" stop-opacity="0.07" />
        <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0" />
      </radialGradient>

      <!-- Linear Accent Accent Line Gradient -->
      <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#007799" stop-opacity="0" />
        <stop offset="30%" stop-color="#007799" stop-opacity="0.9" />
        <stop offset="70%" stop-color="#6544d6" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#6544d6" stop-opacity="0" />
      </linearGradient>

      <!-- Subtle Card Header Gradient -->
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#eaeef2" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
      </linearGradient>

      <!-- Scanline Pattern -->
      <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(87, 96, 106, 0.06)" stroke-width="1" />
      </pattern>

      <!-- Subtle Dot Matrix Grid -->
      <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(87, 96, 106, 0.06)" stroke-width="0.75" />
      </pattern>
    </defs>
  

  
    <!-- Card Frame -->
    <rect x="0" y="0" width="440" height="215" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
    <rect x="1" y="1" width="438" height="213" rx="11" fill="url(#ambientGlow)" />
    <rect x="4" y="4" width="432" height="207" rx="10" fill="url(#cyberGrid)" />
    
    <g class="corner-brackets" stroke="#007799" stroke-width="1.5" fill="none">
      <!-- Top Left -->
      <path d="M 2 10 L 2 2 L 10 2" />
      <!-- Top Right -->
      <path d="M 430 2 L 438 2 L 438 10" />
      <!-- Bottom Left -->
      <path d="M 2 205 L 2 213 L 10 213" />
      <!-- Bottom Right -->
      <path d="M 430 213 L 438 213 L 438 205" />
    </g>
  

    
      <!-- Card Header Line -->
      <line x1="16" y1="38" x2="424" y2="38" stroke="#e1e4e8" stroke-width="1" />
    

    
      <text x="20" y="26" fill="#1f2328" font-size="14" font-weight="700" letter-spacing="1">
        STREAK // CONSISTÊNCIA
      </text>
    

    
      <g transform="translate(420, 22)">
        <text x="-10" y="3" fill="#007799" font-size="11" font-weight="600" text-anchor="end" letter-spacing="0.5">
          DIÁRIO
        </text>
        <circle cx="0" cy="0" r="4" fill="#007799" class="pulse" />
        <circle cx="0" cy="0" r="6" fill="#007799" opacity="0.3" class="pulse" />
      </g>
    
  

  <!-- Left: Animated Ring -->
  <g transform="translate(10, 0)">
    <circle cx="75" cy="125" r="38" class="ring-track" />
    <circle cx="75" cy="125" r="38" class="ring-fill" />
    <text x="75" y="129" fill="#1f2328" font-size="20" font-weight="800" text-anchor="middle">
      13
    </text>
    <text x="75" y="142" fill="#6e7781" font-size="9" font-weight="600" text-anchor="middle">
      DIAS
    </text>
  </g>

  <!-- Right: Streak Stats Box -->
  <g transform="translate(160, 60)">
    <!-- Current Streak -->
    <rect x="0" y="0" width="256" height="60" rx="6" fill="#eaeef2" stroke="#e1e4e8" stroke-width="1" />
    <text x="14" y="22" fill="#57606a" font-size="9.5" font-weight="700" letter-spacing="0.8">SEQUÊNCIA ATUAL</text>
    <text x="14" y="48" fill="#007799" font-size="22" font-weight="800">
      13 <tspan font-size="12" font-weight="600" fill="#57606a">dias consecutivos</tspan>
    </text>
  </g>

  <g transform="translate(160, 134)">
    <!-- Longest Streak -->
    <rect x="0" y="0" width="256" height="60" rx="6" fill="#eaeef2" stroke="#e1e4e8" stroke-width="1" />
    <text x="14" y="22" fill="#57606a" font-size="9.5" font-weight="700" letter-spacing="0.8">RECORDE PESSOAL</text>
    <text x="14" y="48" fill="#1f2328" font-size="22" font-weight="800">
      13 <tspan font-size="12" font-weight="600" fill="#57606a">dias consecutivos</tspan>
    </text>
  </g>
</svg>