<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 140" width="890" height="140" role="img" aria-label="Linguagens Mais Utilizadas">
  <title>Linguagens e Tecnologias Mais Utilizadas</title>
  <style>
    
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-subtle: #eaeef2;
      --border: #d0d7de;
      --border-subtle: #e1e4e8;
      --text: #1f2328;
      --text-sec: #57606a;
      --text-ter: #6e7781;
      --accent: #007799;
      --accent-subtle: rgba(0, 119, 153, 0.10);
      --accent-glow: rgba(0, 119, 153, 0.20);
      --accent-sec: #6544d6;
      --accent-sec-subtle: rgba(101, 68, 214, 0.10);
      --success: #1a7f37;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    text {
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Pulse animation for status dots */
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    .pulse {
      transform-origin: center;
      animation: pulse-glow 3.5s ease-in-out infinite;
    }

    /* Staggered entrance reveal */
    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Stroke draw effect */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Very subtle rare glitch (1x every 8s, 0.3s duration) */
    @keyframes subtle-glitch {
      0%, 96%, 100% {
        transform: translate(0, 0);
        opacity: 1;
        text-shadow: none;
      }
      97% {
        transform: translate(-1.5px, 0.5px);
        text-shadow: 1px 0 var(--accent), -1px 0 var(--accent-sec);
      }
      98% {
        transform: translate(1.5px, -0.5px);
        text-shadow: -1px 0 var(--accent), 1px 0 var(--accent-sec);
      }
      99% {
        transform: translate(0, 0);
        text-shadow: none;
      }
    }

    .glitch-text {
      display: inline-block;
      animation: subtle-glitch 8s infinite ease-in-out;
    }

    /* Scanline traversing effect */
    @keyframes scanline-sweep {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(300px);
        opacity: 0;
      }
    }

    .scanline {
      animation: scanline-sweep 7s linear infinite;
    }

    /* Traveling light dot */
    @keyframes travel-dot {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateX(1100px);
        opacity: 0;
      }
    }

    /* Cursor blink */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: blink 1.1s infinite steps(1);
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, .pulse, .fade-in, .glitch-text, .scanline, .cursor, .animated-stroke {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
      }
    }
  
    .lang-bar {
      transform-origin: left;
      animation: fade-in-up 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
  
    <defs>
      <!-- Cyberpunk Radial Ambient Glow -->
      <radialGradient id="ambientGlow" cx="80%" cy="20%" r="70%">
        <stop offset="0%" stop-color="#6544d6" stop-opacity="0.07" />
        <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0" />
      </radialGradient>

      <!-- Linear Accent Accent Line Gradient -->
      <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#007799" stop-opacity="0" />
        <stop offset="30%" stop-color="#007799" stop-opacity="0.9" />
        <stop offset="70%" stop-color="#6544d6" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#6544d6" stop-opacity="0" />
      </linearGradient>

      <!-- Subtle Card Header Gradient -->
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#eaeef2" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
      </linearGradient>

      <!-- Scanline Pattern -->
      <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(87, 96, 106, 0.06)" stroke-width="1" />
      </pattern>

      <!-- Subtle Dot Matrix Grid -->
      <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(87, 96, 106, 0.06)" stroke-width="0.75" />
      </pattern>
    </defs>
  

  
    <!-- Card Frame -->
    <rect x="0" y="0" width="890" height="140" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" />
    <rect x="1" y="1" width="888" height="138" rx="11" fill="url(#ambientGlow)" />
    <rect x="4" y="4" width="882" height="132" rx="10" fill="url(#cyberGrid)" />
    
    <g class="corner-brackets" stroke="#007799" stroke-width="1.5" fill="none">
      <!-- Top Left -->
      <path d="M 2 10 L 2 2 L 10 2" />
      <!-- Top Right -->
      <path d="M 880 2 L 888 2 L 888 10" />
      <!-- Bottom Left -->
      <path d="M 2 130 L 2 138 L 10 138" />
      <!-- Bottom Right -->
      <path d="M 880 138 L 888 138 L 888 130" />
    </g>
  

    
      <!-- Card Header Line -->
      <line x1="16" y1="38" x2="874" y2="38" stroke="#e1e4e8" stroke-width="1" />
    

    
      <text x="20" y="26" fill="#1f2328" font-size="14" font-weight="700" letter-spacing="1">
        LINGUAGENS // CÓDIGO FONTE
      </text>
    

    
      <g transform="translate(870, 22)">
        <text x="-10" y="3" fill="#57606a" font-size="11" font-weight="600" text-anchor="end" letter-spacing="0.5">
          EXCLUI MARKUP &amp;amp; LOCKFILES
        </text>
        <circle cx="0" cy="0" r="4" fill="#57606a" class="" />
        <circle cx="0" cy="0" r="6" fill="#57606a" opacity="0.3" class="" />
      </g>
    
  

  <!-- Stacked Bar Container -->
  <g transform="translate(30, 54)">
    <rect x="0" y="0" width="830" height="14" rx="4" fill="#eaeef2" stroke="#e1e4e8" stroke-width="1" />
    <g class="lang-bar">
      
      <rect x="0" y="0" width="403" height="14" fill="#3178c6" rx="3" />
    
      <rect x="403" y="0" width="200" height="14" fill="#f7df1e" rx="0" />
    
      <rect x="603" y="0" width="116" height="14" fill="#e38c00" rx="0" />
    
      <rect x="719" y="0" width="64" height="14" fill="#384d54" rx="0" />
    
      <rect x="783" y="0" width="47" height="14" fill="#2d3748" rx="3" />
    
    </g>
  </g>

  <!-- Legend Items Row -->
  <g transform="translate(10, 88)">
    
      <g transform="translate(20, 0)">
        <circle cx="5" cy="5" r="4" fill="#3178c6" />
        <text x="15" y="8" fill="#1f2328" font-size="11" font-weight="600">TypeScript</text>
        <text x="15" y="22" fill="#57606a" font-size="10" font-weight="500">48.5%</text>
      </g>
    
      <g transform="translate(180, 0)">
        <circle cx="5" cy="5" r="4" fill="#f7df1e" />
        <text x="15" y="8" fill="#1f2328" font-size="11" font-weight="600">JavaScript</text>
        <text x="15" y="22" fill="#57606a" font-size="10" font-weight="500">24.1%</text>
      </g>
    
      <g transform="translate(340, 0)">
        <circle cx="5" cy="5" r="4" fill="#e38c00" />
        <text x="15" y="8" fill="#1f2328" font-size="11" font-weight="600">SQL</text>
        <text x="15" y="22" fill="#57606a" font-size="10" font-weight="500">14%</text>
      </g>
    
      <g transform="translate(500, 0)">
        <circle cx="5" cy="5" r="4" fill="#384d54" />
        <text x="15" y="8" fill="#1f2328" font-size="11" font-weight="600">Docker</text>
        <text x="15" y="22" fill="#57606a" font-size="10" font-weight="500">7.7%</text>
      </g>
    
      <g transform="translate(660, 0)">
        <circle cx="5" cy="5" r="4" fill="#2d3748" />
        <text x="15" y="8" fill="#1f2328" font-size="11" font-weight="600">Prisma</text>
        <text x="15" y="22" fill="#57606a" font-size="10" font-weight="500">5.7%</text>
      </g>
    
  </g>
</svg>