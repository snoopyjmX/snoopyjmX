<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 205" width="890" height="205" role="img" aria-label="Distribuição de Commits">
  <title>Distribuição de Commits por Hora e Dia da Semana</title>
  <style>
    
    :root {
      --bg: #0a0e14;
      --surface: #0d1117;
      --surface-subtle: #161b22;
      --border: #30363d;
      --border-subtle: #21262d;
      --text: #e6edf3;
      --text-sec: #8b949e;
      --text-ter: #6e7681;
      --accent: #00e5ff;
      --accent-subtle: rgba(0, 229, 255, 0.12);
      --accent-glow: rgba(0, 229, 255, 0.25);
      --accent-sec: #7c5cff;
      --accent-sec-subtle: rgba(124, 92, 255, 0.12);
      --success: #3fb950;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    text {
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Pulse animation for status dots */
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    .pulse {
      transform-origin: center;
      animation: pulse-glow 3.5s ease-in-out infinite;
    }

    /* Staggered entrance reveal (opacity only to preserve SVG translate transforms) */
    @keyframes fade-in-up {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .fade-in {
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Stroke draw effect */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Very subtle rare glitch (1x every 8s, 0.3s duration) */
    @keyframes subtle-glitch {
      0%, 96%, 100% {
        opacity: 1;
      }
      97% {
        opacity: 0.75;
      }
      98% {
        opacity: 0.9;
      }
      99% {
        opacity: 1;
      }
    }

    .glitch-text {
      animation: subtle-glitch 8s infinite ease-in-out;
    }

    /* Scanline traversing effect */
    @keyframes scanline-sweep {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(300px);
        opacity: 0;
      }
    }

    .scanline {
      animation: scanline-sweep 7s linear infinite;
    }

    /* Traveling light dot */
    @keyframes travel-dot {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateX(1100px);
        opacity: 0;
      }
    }

    /* Cursor blink */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: blink 1.1s infinite steps(1);
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, .pulse, .fade-in, .glitch-text, .scanline, .cursor, .animated-stroke {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
      }
    }
  
    .chart-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: var(--text-sec);
    }
  </style>
  
    <defs>
      <!-- Cyberpunk Radial Ambient Glow -->
      <radialGradient id="ambientGlow" cx="80%" cy="20%" r="70%">
        <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#0a0e14" stop-opacity="0" />
      </radialGradient>

      <!-- Linear Accent Accent Line Gradient -->
      <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
        <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.9" />
        <stop offset="70%" stop-color="#7c5cff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#7c5cff" stop-opacity="0" />
      </linearGradient>

      <!-- Subtle Card Header Gradient -->
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#161b22" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95" />
      </linearGradient>

      <!-- Scanline Pattern -->
      <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(110, 118, 129, 0.06)" stroke-width="1" />
      </pattern>

      <!-- Subtle Dot Matrix Grid -->
      <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(110, 118, 129, 0.06)" stroke-width="0.75" />
      </pattern>
    </defs>
  

  
    <!-- Card Frame -->
    <rect x="0" y="0" width="890" height="205" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <rect x="1" y="1" width="888" height="203" rx="11" fill="url(#ambientGlow)" />
    <rect x="4" y="4" width="882" height="197" rx="10" fill="url(#cyberGrid)" />
    
    <g class="corner-brackets" stroke="#00e5ff" stroke-width="1.5" fill="none">
      <!-- Top Left -->
      <path d="M 2 10 L 2 2 L 10 2" />
      <!-- Top Right -->
      <path d="M 880 2 L 888 2 L 888 10" />
      <!-- Bottom Left -->
      <path d="M 2 195 L 2 203 L 10 203" />
      <!-- Bottom Right -->
      <path d="M 880 203 L 888 203 L 888 195" />
    </g>
  

    
      <!-- Card Header Line -->
      <line x1="16" y1="38" x2="874" y2="38" stroke="#21262d" stroke-width="1" />
    

    
      <text x="20" y="26" fill="#e6edf3" font-size="14" font-weight="700" letter-spacing="1">
        DISTRIBUIÇÃO TEMPORAL // HORÁRIO DE BRASÍLIA
      </text>
    

    
      <g transform="translate(870, 22)">
        <text x="-10" y="3" fill="#8b949e" font-size="11" font-weight="600" text-anchor="end" letter-spacing="0.5">
          AMERICA/SAO_PAULO
        </text>
        <circle cx="0" cy="0" r="4" fill="#8b949e" class="" />
        <circle cx="0" cy="0" r="6" fill="#8b949e" opacity="0.3" class="" />
      </g>
    
  

  <!-- Subheaders -->
  <text x="36" y="58" class="chart-label">HORÁRIO DO DIA (00h - 23h)</text>
  <text x="580" y="58" class="chart-label">DIA DA SEMANA</text>

  <!-- Divider between charts -->
  <line x1="535" y1="52" x2="535" y2="175" stroke="#21262d" stroke-width="1" stroke-dasharray="2 4" />

