<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 215" width="390" height="215" role="img" aria-label="Card do Projeto NÓS">
  <title>NÓS — App Privado para Casais</title>
  <style>
    :root {
      --bg: #0a0e14;
      --surface: #0d1117;
      --surface-subtle: #161b22;
      --border: #30363d;
      --border-subtle: #21262d;
      --text: #e6edf3;
      --text-sec: #8b949e;
      --text-ter: #6e7681;
      --accent: #00e5ff;
      --accent-subtle: rgba(0, 229, 255, 0.12);
      --accent-glow: rgba(0, 229, 255, 0.25);
      --accent-sec: #7c5cff;
      --accent-sec-subtle: rgba(124, 92, 255, 0.12);
      --success: #3fb950;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    text {
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Pulse animation for status dots */
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.85);
      }
    }

    .pulse {
      transform-origin: center;
      animation: pulse-glow 3.5s ease-in-out infinite;
    }

    /* Staggered entrance reveal (opacity only to preserve SVG translate transforms) */
    @keyframes fade-in-up {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .fade-in {
      animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Stroke draw effect */
    @keyframes draw-line {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Very subtle rare glitch (1x every 8s, 0.3s duration) */
    @keyframes subtle-glitch {
      0%, 96%, 100% {
        opacity: 1;
      }
      97% {
        opacity: 0.75;
      }
      98% {
        opacity: 0.9;
      }
      99% {
        opacity: 1;
      }
    }

    .glitch-text {
      animation: subtle-glitch 8s infinite ease-in-out;
    }

    /* Scanline traversing effect */
    @keyframes scanline-sweep {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(300px);
        opacity: 0;
      }
    }

    .scanline {
      animation: scanline-sweep 7s linear infinite;
    }

    /* Traveling light dot */
    @keyframes travel-dot {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateX(1100px);
        opacity: 0;
      }
    }

    /* Cursor blink */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: blink 1.1s infinite steps(1);
    }

    /* Accessibility: prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, .pulse, .fade-in, .glitch-text, .scanline, .cursor, .animated-stroke {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
      }
    }
  </style>
  
    <defs>
      <!-- Cyberpunk Radial Ambient Glow -->
      <radialGradient id="ambientGlow" cx="80%" cy="20%" r="70%">
        <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#0a0e14" stop-opacity="0" />
      </radialGradient>

      <!-- Linear Accent Accent Line Gradient -->
      <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
        <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.9" />
        <stop offset="70%" stop-color="#7c5cff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#7c5cff" stop-opacity="0" />
      </linearGradient>

      <!-- Subtle Card Header Gradient -->
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#161b22" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95" />
      </linearGradient>

      <!-- Scanline Pattern -->
      <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(110, 118, 129, 0.06)" stroke-width="1" />
      </pattern>

      <!-- Subtle Dot Matrix Grid -->
      <pattern id="cyberGrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(110, 118, 129, 0.06)" stroke-width="0.75" />
      </pattern>
    </defs>
  

  
    <!-- Card Frame -->
    <rect x="0" y="0" width="390" height="215" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <rect x="1" y="1" width="388" height="213" rx="11" fill="url(#ambientGlow)" />
    <rect x="4" y="4" width="382" height="207" rx="10" fill="url(#cyberGrid)" />
    
    <g class="corner-brackets" stroke="#00e5ff" stroke-width="1.5" fill="none">
      <!-- Top Left -->
      <path d="M 2 10 L 2 2 L 10 2" />
      <!-- Top Right -->
      <path d="M 380 2 L 388 2 L 388 10" />
      <!-- Bottom Left -->
      <path d="M 2 205 L 2 213 L 10 213" />
      <!-- Bottom Right -->
      <path d="M 380 213 L 388 213 L 388 205" />
    </g>
  

    
      <!-- Card Header Line -->
      <line x1="16" y1="38" x2="374" y2="38" stroke="#21262d" stroke-width="1" />
    

    
      <text x="20" y="26" fill="#e6edf3" font-size="14" font-weight="700" letter-spacing="1">
        NÓS
      </text>
    

    
      <g transform="translate(370, 22)">
        <text x="-10" y="3" fill="#3fb950" font-size="11" font-weight="600" text-anchor="end" letter-spacing="0.5">
          EM PRODUÇÃO
        </text>
        <circle cx="0" cy="0" r="4" fill="#3fb950" class="pulse" />
        <circle cx="0" cy="0" r="6" fill="#3fb950" opacity="0.3" class="pulse" />
      </g>
    
  

  <!-- One line description -->
  <text x="20" y="60" fill="#8b949e" font-size="11" font-weight="500">
    App privado para casais (mensagens, memórias e datas)
  </text>

  <!-- Production Highlight Badge -->
  <g transform="translate(20, 78)">
    <rect x="0" y="0" width="350" height="24" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <text x="12" y="16" fill="#00e5ff" font-size="10" font-weight="700">STATUS:</text>
    <text x="70" y="16" fill="#e6edf3" font-size="10.5" font-weight="600">PWA em Produção na Vercel</text>
  </g>

  <!-- Stack Chips -->
  <g transform="translate(20, 116)">
    
    <g class="chip">
      <rect x="0" y="0" width="102" height="22" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1" />
      
      <text x="51" y="15" fill="#8b949e" font-size="11" text-anchor="middle" font-weight="500">
        React Native
      </text>
    </g>
  
    
    <g class="chip">
      <rect x="104" y="0" width="95" height="22" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1" />
      
      <text x="151.5" y="15" fill="#8b949e" font-size="11" text-anchor="middle" font-weight="500">
        Expo Router
      </text>
    </g>
  
    
    <g class="chip">
      <rect x="202" y="0" width="88" height="22" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1" />
      
      <text x="246" y="15" fill="#8b949e" font-size="11" text-anchor="middle" font-weight="500">
        TypeScript
      </text>
    </g>
  
    
    <g class="chip">
      <rect x="294" y="0" width="74" height="22" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1" />
      
      <text x="331" y="15" fill="#8b949e" font-size="11" text-anchor="middle" font-weight="500">
        Supabase
      </text>
    </g>
  
  </g>

  <!-- Security & Architecture Highlights -->
  <g transform="translate(20, 160)">
    <rect x="0" y="0" width="350" height="38" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <circle cx="14" cy="19" r="3.5" fill="#3fb950" />
    <text x="26" y="16" fill="#e6edf3" font-size="10" font-weight="600">ARQUITETURA: RLS Versionada · Convites por Código</text>
    <text x="26" y="29" fill="#6e7681" font-size="9.5" font-weight="500">Security Headers · Design System Próprio · Reanimated</text>
  </g>
</svg>